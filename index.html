<!DOCTYPE html>
<html lang="fr">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculatrice</title>
        <link rel="stylesheet" href="devoir.css">
        <meta name="robots" content="noindex">
    
</head>
<body>
    <main class="container">
        <h1>Calculatrice</h1>

        <form id="calcForm" novalidate>
            <div class="field">
                <label for="a">A</label>
                <input id="a" name="a" type="text" inputmode="decimal" required aria-describedby="aError">
                <small id="aError" class="error" aria-live="polite"></small>
            </div>

            <div class="field">
                <label for="b">B</label>
                <input id="b" name="b" type="text" inputmode="decimal" required aria-describedby="bError">
                <small id="bError" class="error" aria-live="polite"></small>
            </div>

            <button type="submit" id="calcBtn">Calculer</button>
        </form>

        <section id="results" class="results" aria-live="polite" aria-atomic="true">
            <h2>Résultats :</h2>
            <div id="output" class="output">
                <p class="placeholder"></p>
            </div>
        </section>
    </main>

    <script src="devoir.js" defer></script>
</body>
</html>
